name: Verificações de código

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes das regras de negócio
        run: npm test
      - name: Tipagem
        run: npm run type-check
      - name: Lint
        run: npm run lint
